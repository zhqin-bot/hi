<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Remaining Warmth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #0b0d12;
            color: #ecefe6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Frost Overlay Visual Effect */
        #frost-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 150, 255, 0);
            transition: box-shadow 0.3s ease;
            z-index: 10;
        }

        .container {
            width: 92%;
            max-width: 480px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 1;
            position: relative;
        }

        h1 { font-size: 1.5rem; margin-bottom: 8px; letter-spacing: 1px; }
        p.subtitle { font-size: 0.9rem; color: #8a919e; margin-bottom: 25px; line-height: 1.5; font-style: italic; }

        button.primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            background: #3b82f6;
            color: #fff;
            transition: all 0.2s;
        }

        .header-zone {
            width: 100%;
            text-align: center;
        }

        .timer { font-size: 1.3rem; color: #eab308; font-weight: bold; }
        .status-msg { font-size: 0.85rem; color: #9ca3af; margin-top: 6px; font-style: italic; min-height: 24px; }

        /* Split Bottom Layout */
        .bottom-players-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-top: auto;
        }

        .player-side {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 10px;
            border-radius: 16px;
            text-align: center;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .player-tag {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .player-a-tag { color: #60a5fa; }
        .player-b-tag { color: #f472b6; }

        .temp-desc {
            font-size: 0.9rem;
            font-weight: 500;
            color: #ecefe6;
            margin: 10px 0;
            line-height: 1.3;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.hold-btn {
            width: 100%;
            background: #ef4444;
            height: 60px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            cursor: pointer;
            line-height: 1.2;
            touch-action: none;
        }
        button.hold-btn:active, button.hold-btn.active {
            background: #dc2626;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="frost-overlay"></div>

<div class="container">
    <!-- 1. Start Screen (No Rules Revealed) -->
    <div id="lobby" style="margin: auto 0; text-align: center;">
        <h1>The Remaining Warmth</h1>
        <p class="subtitle">
            "You two are trapped in the extreme cold...<br>
            Survive until help arrives."
        </p>
        <button class="primary-btn" onclick="startGame()">Begin</button>
    </div>

    <!-- 2. Split Screen Gameplay Area -->
    <div id="game" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
        
        <!-- Top Status Zone -->
        <div class="header-zone">
            <div class="timer">Rescue Arrival in: <span id="time-left">60</span>s</div>
            <div class="status-msg" id="global-status">...</div>
        </div>

        <!-- Bottom Split Player Zone -->
        <div class="bottom-players-wrapper">
            
            <!-- Left Side: Player A -->
            <div class="player-side">
                <div>
                    <div class="player-tag player-a-tag">PLAYER A</div>
                    <div class="temp-desc" id="p1-desc">Feeling warm...</div>
                </div>
                <button id="hold-button" class="hold-btn">HOLD 🤝</button>
            </div>

            <!-- Right Side: Player B -->
            <div class="player-side">
                <div>
                    <div class="player-tag player-b-tag">PLAYER B</div>
                    <div class="temp-desc" id="p2-desc">Shivering slightly...</div>
                </div>
                <div style="height: 60px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #6b7280;">
                    (Passive)
                </div>
            </div>

        </div>
    </div>

    <!-- 3. Game Over Screen -->
    <div id="game-over" class="hidden" style="margin: auto 0; text-align: center;">
        <h1 id="end-title">Game Over</h1>
        <p id="end-desc" style="margin: 20px 0; font-size: 1rem; line-height: 1.5;"></p>
        <button class="primary-btn" onclick="location.reload()">Try Again</button>
    </div>
</div>

<script>
    // Elevated starting temperatures (+5°F)
    let p1Temp = 102.8; 
    let p2Temp = 91.5; 
    let timeLeft = 60;
    let isTransferring = false;
    let gameInterval = null;

    function startGame() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        setupAControls();
        gameInterval = setInterval(gameLoop, 1000);
    }

    function setupAControls() {
        const btn = document.getElementById('hold-button');
        
        const startTransfer = (e) => {
            if (e.cancelable) e.preventDefault();
            isTransferring = true;
            btn.classList.add('active');
        };

        const stopTransfer = (e) => {
            if (e.cancelable) e.preventDefault();
            isTransferring = false;
            btn.classList.remove('active');
        };

        btn.addEventListener('mousedown', startTransfer);
        btn.addEventListener('mouseup', stopTransfer);
        btn.addEventListener('mouseleave', stopTransfer);
        btn.addEventListener('touchstart', startTransfer, { passive: false });
        btn.addEventListener('touchend', stopTransfer, { passive: false });
        btn.addEventListener('touchcancel', stopTransfer, { passive: false });
    }

    function gameLoop() {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;

        // 1. Natural temperature decay (-0.25°F/s)
        p1Temp = parseFloat((p1Temp - 0.25).toFixed(1));
        p2Temp = parseFloat((p2Temp - 0.25).toFixed(1));

        // 2. Heat transfer logic
        if (isTransferring) {
            p1Temp = parseFloat((p1Temp - 0.55).toFixed(1)); // Player A loses heat
            p2Temp = parseFloat((p2Temp + 0.65).toFixed(1)); // Player B gains heat
        }

        // 3. UI Updates
        updateDescriptions();
        updateFrostUI(Math.min(p1Temp, p2Temp));

        // 4. Win/Loss Conditions
        if (p1Temp <= 80.0) {
            endGame("❌ RESCUE FAILED\nPlayer A collapsed from hypothermia!", false);
        } else if (p2Temp <= 80.0) {
            endGame("❌ RESCUE FAILED\nPlayer B collapsed from hypothermia!", false);
        } else if (timeLeft <= 0) {
            endGame("🎉 RESCUE SUCCESS!\nBoth players survived by sharing warmth!", true);
        }
    }

    // Dynamic state description helper
    function getStatusDescription(temp) {
        if (temp >= 100) return "🔥 Feverishly hot & sweating";
        if (temp >= 95) return "😌 Warm & comfortable";
        if (temp >= 90) return "🌬️ Chill setting in, cold hands";
        if (temp >= 85) return "🥶 Shivering violently, lips blue";
        if (temp >= 82) return "⚠️ Pale, limbs losing sensation!";
        return "🚨 Fading out of consciousness...";
    }

    function updateDescriptions() {
        document.getElementById('p1-desc').innerText = getStatusDescription(p1Temp);
        document.getElementById('p2-desc').innerText = getStatusDescription(p2Temp);

        const msg = document.getElementById('global-status');
        if (isTransferring) {
            msg.innerText = "🤝 Physical contact active...";
            msg.style.color = "#ef4444";
        } else {
            msg.innerText = "❄️ Freezing wind continues...";
            msg.style.color = "#9ca3af";
        }
    }

    function updateFrostUI(lowestTemp) {
        const overlay = document.getElementById('frost-overlay');
        if (lowestTemp < 90) {
            let severity = (90 - lowestTemp) * 10;
            overlay.style.boxShadow = `inset 0 0 ${severity * 2}px rgba(0, 150, 255, ${severity/100})`;
        } else {
            overlay.style.boxShadow = `inset 0 0 0px rgba(0, 0, 0, 0)`;
        }
    }

    function endGame(reason, isSuccess) {
        clearInterval(gameInterval);
        document.getElementById('game').classList.add('hidden');
        document.getElementById('game-over').classList.remove('hidden');
        
        document.getElementById('end-title').innerText = isSuccess ? "VICTORY" : "FAILURE";
        document.getElementById('end-title').style.color = isSuccess ? "#4ade80" : "#f87171";
        document.getElementById('end-desc').innerText = reason;
    }
</script>

</body>
</html>
