<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Remaining Warmth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b0d12;
            color: #ecefe6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Frost Overlay Visual Effect */
        #frost-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 150, 255, 0);
            transition: box-shadow 0.3s ease;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            z-index: 1;
            position: relative;
        }

        h1 { font-size: 1.5rem; margin-bottom: 8px; letter-spacing: 1px; }
        p.subtitle { font-size: 0.85rem; color: #8a919e; margin-bottom: 20px; line-height: 1.4; }

        button.primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            background: #3b82f6;
            color: #fff;
            transition: all 0.2s;
        }

        .header-zone {
            width: 100%;
            text-align: center;
        }

        .timer { font-size: 1.3rem; color: #eab308; font-weight: bold; }
        .status-msg { font-size: 0.85rem; color: #9ca3af; margin-top: 6px; font-style: italic; min-height: 24px; }

        /* Split Bottom Layout */
        .bottom-players-wrapper {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-top: auto;
        }

        .player-side {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 12px;
            border-radius: 16px;
            text-align: center;
        }

        .player-tag {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .player-a-tag { color: #60a5fa; }
        .player-b-tag { color: #f472b6; }

        .temp-val {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            margin: 4px 0;
        }

        button.hold-btn {
            width: 100%;
            background: #ef4444;
            height: 70px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            margin-top: 10px;
            cursor: pointer;
            line-height: 1.2;
        }
        button.hold-btn:active, button.hold-btn.active {
            background: #dc2626;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="frost-overlay"></div>

<div class="container">
    <!-- 1. Start Screen -->
    <div id="lobby" style="margin: auto 0; text-align: center;">
        <h1>The Remaining Warmth</h1>
        <p class="subtitle">
            <b>Rule:</b> Heat can be transferred.<br>
            If either player collapses (&le;80°F), rescue fails.<br><br>
            <i>Place phone between Player A and Player B.</i>
        </p>
        <button class="primary-btn" onclick="startGame()">Start Prototype</button>
    </div>

    <!-- 2. Split Screen Gameplay Area -->
    <div id="game" class="hidden" style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
        
        <!-- Top Status Zone -->
        <div class="header-zone">
            <div class="timer">Rescue Arrival in: <span id="time-left">60</span>s</div>
            <div class="status-msg" id="global-status">Natural cooling in progress...</div>
        </div>

        <!-- Bottom Split Player Zone (Far Apart) -->
        <div class="bottom-players-wrapper">
            
            <!-- Left Side: Player A -->
            <div class="player-side">
                <div class="player-tag player-a-tag">PLAYER A</div>
                <div class="temp-val"><span id="p1-temp">97.8</span>°F</div>
                <button id="hold-button" class="hold-btn">HOLD:<br>TRANSFER 🤝</button>
            </div>

            <!-- Right Side: Player B -->
            <div class="player-side">
                <div class="player-tag player-b-tag">PLAYER B</div>
                <div class="temp-val"><span id="p2-temp">86.5</span>°F</div>
                <div style="font-size: 0.75rem; color: #8a919e; margin-top: 18px; line-height: 1.2;">
                    Receiving warmth<br>from Player A
                </div>
            </div>

        </div>
    </div>

    <!-- 3. Game Over Screen -->
    <div id="game-over" class="hidden" style="margin: auto 0; text-align: center;">
        <h1 id="end-title">Game Over</h1>
        <p id="end-desc" style="margin: 20px 0; font-size: 1rem; line-height: 1.5;"></p>
        <button class="primary-btn" onclick="location.reload()">Restart Prototype</button>
    </div>
</div>

<script>
    let p1Temp = 97.8;
    let p2Temp = 86.5; 
    let timeLeft = 60;
    let isTransferring = false;
    let gameInterval = null;

    function startGame() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        setupAControls();
        gameInterval = setInterval(gameLoop, 1000);
    }

    function setupAControls() {
        const btn = document.getElementById('hold-button');
        
        const startTransfer = (e) => {
            e.preventDefault();
            isTransferring = true;
            btn.classList.add('active');
        };

        const stopTransfer = (e) => {
            e.preventDefault();
            isTransferring = false;
            btn.classList.remove('active');
        };

        btn.addEventListener('mousedown', startTransfer);
        btn.addEventListener('mouseup', stopTransfer);
        btn.addEventListener('touchstart', startTransfer);
        btn.addEventListener('touchend', stopTransfer);
    }

    function gameLoop() {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;

        // 1. Natural temperature decay (-0.25°F/s)
        p1Temp = parseFloat((p1Temp - 0.25).toFixed(1));
        p2Temp = parseFloat((p2Temp - 0.25).toFixed(1));

        // 2. Heat transfer logic
        if (isTransferring) {
            p1Temp = parseFloat((p1Temp - 0.55).toFixed(1)); // Player A loses heat
            p2Temp = parseFloat((p2Temp + 0.65).toFixed(1)); // Player B gains heat
        }

        // 3. UI Updates
        document.getElementById('p1-temp').innerText = p1Temp.toFixed(1);
        document.getElementById('p2-temp').innerText = p2Temp.toFixed(1);
        
        updateFrostUI(Math.min(p1Temp, p2Temp));
        updateStatusText();

        // 4. Win/Loss Conditions
        if (p1Temp <= 80.0) {
            endGame("❌ RESCUE FAILED\nPlayer A collapsed from hypothermia!", false);
        } else if (p2Temp <= 80.0) {
            endGame("❌ RESCUE FAILED\nPlayer B collapsed from hypothermia!", false);
        } else if (timeLeft <= 0) {
            endGame("🎉 RESCUE SUCCESS!\nBoth players survived by sharing body heat!", true);
        }
    }

    function updateFrostUI(lowestTemp) {
        const overlay = document.getElementById('frost-overlay');
        if (lowestTemp < 90) {
            let severity = (90 - lowestTemp) * 10;
            overlay.style.boxShadow = `inset 0 0 ${severity * 2}px rgba(0, 150, 255, ${severity/100})`;
        } else {
            overlay.style.boxShadow = `inset 0 0 0px rgba(0, 0, 0, 0)`;
        }
    }

    function updateStatusText() {
        const msg = document.getElementById('global-status');
        if (isTransferring) {
            msg.innerText = "🔥 HEAT TRANSFER ACTIVE: Player A → Player B";
            msg.style.color = "#ef4444";
        } else {
            msg.innerText = "❄️ Cold environment active. Temperatures dropping...";
            msg.style.color = "#9ca3af";
        }
    }

    function endGame(reason, isSuccess) {
        clearInterval(gameInterval);
        document.getElementById('game').classList.add('hidden');
        document.getElementById('game-over').classList.remove('hidden');
        
        document.getElementById('end-title').innerText = isSuccess ? "VICTORY" : "FAILURE";
        document.getElementById('end-title').style.color = isSuccess ? "#4ade80" : "#f87171";
        document.getElementById('end-desc').innerText = reason;
    }
</script>

</body>
</html>
